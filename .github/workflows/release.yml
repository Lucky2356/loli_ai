name: Release APK

# Публикует подписанный APK в GitHub Releases (релизы не расходуют квоту Actions artifacts).
# Запуск: вкладка Actions → Release APK → Run workflow, либо push тега вида v1.0.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия (например 1.0.0)"
        required: true
        default: "1.0.0"
      build_type:
        description: "Тип сборки"
        type: choice
        options: [release, debug]
        default: release
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then VERSION="${GITHUB_REF_NAME#v}"; TYPE=release; else VERSION="${{ inputs.version }}"; TYPE="${{ inputs.build_type }}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Cache Vosk model
        uses: actions/cache@v4
        with:
          path: |
            app/vosk-assets
            app/vosk-cache
          key: vosk-model-small-ru-0.22

      - name: Offline speech model (embedded into APK)
        run: ./scripts/fetch-vosk-model.sh

      - name: Restore signing key
        env:
          LOLI_KEYSTORE_BASE64: ${{ secrets.LOLI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LOLI_KEYSTORE_BASE64" ]; then
            echo "$LOLI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/loli.jks"
            echo "LOLI_KEYSTORE_FILE=$RUNNER_TEMP/loli.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет LOLI_KEYSTORE_BASE64 не задан: APK будет подписан временным debug-ключом. Для обновлений без переустановки добавьте ключ (см. README)."
          fi

      - name: Tests + build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LOLI_KEYSTORE_PASSWORD: ${{ secrets.LOLI_KEYSTORE_PASSWORD }}
          LOLI_KEY_ALIAS: ${{ secrets.LOLI_KEY_ALIAS }}
          LOLI_KEY_PASSWORD: ${{ secrets.LOLI_KEY_PASSWORD }}
          LOLI_VERSION_NAME: ${{ steps.v.outputs.version }}
          LOLI_VERSION_CODE: ${{ github.run_number }}
        run: |
          TASK=$([ "${{ steps.v.outputs.type }}" = "debug" ] && echo assembleDebug || echo assembleRelease)
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:$TASK
          mkdir -p dist
          cp app/build/outputs/apk/${{ steps.v.outputs.type }}/*.apk "dist/loli-${{ steps.v.outputs.version }}-${{ steps.v.outputs.type }}.apk"
          # Зеркало офлайн-модели для сборок без встроенной модели (скачивание из приложения).
          cp app/vosk-cache/vosk-model-small-ru-0.22.zip dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Лоли ${{ steps.v.outputs.version }}
          files: |
            dist/*.apk
            dist/*.zip
          prerelease: ${{ steps.v.outputs.type == 'debug' }}
          generate_release_notes: true
