name: Release APK

# Публикует подписанный APK в GitHub Releases (релизы не расходуют квоту Actions artifacts).
# Запуск: вкладка Actions → Release APK → Run workflow, либо push тега вида v1.0.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия (например 1.0.0)"
        required: true
        default: "1.0.0"
      build_type:
        description: "Тип сборки"
        type: choice
        options: [release, debug]
        default: release
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then VERSION="${GITHUB_REF_NAME#v}"; TYPE=release; else VERSION="${{ inputs.version }}"; TYPE="${{ inputs.build_type }}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Cache Vosk model
        uses: actions/cache@v4
        with:
          path: |
            app/vosk-assets
            app/vosk-cache
          key: vosk-model-small-ru-0.22

      - name: Offline speech model (embedded into APK)
        run: ./scripts/fetch-vosk-model.sh

      # Постоянный ключ подписи: из секрета LOLI_KEYSTORE_BASE64, а если его нет — созданный один раз
      # и хранящийся в кэше Actions. Одинаковая подпись нужна, чтобы новые версии ставились поверх старых.
      - name: Restore signing key from cache
        id: keycache
        uses: actions/cache/restore@v4
        with:
          path: .signing
          key: loli-signing-key-v1

      - name: Prepare signing key
        env:
          LOLI_KEYSTORE_BASE64: ${{ secrets.LOLI_KEYSTORE_BASE64 }}
          LOLI_KEYSTORE_PASSWORD_SECRET: ${{ secrets.LOLI_KEYSTORE_PASSWORD }}
          LOLI_KEY_ALIAS_SECRET: ${{ secrets.LOLI_KEY_ALIAS }}
          LOLI_KEY_PASSWORD_SECRET: ${{ secrets.LOLI_KEY_PASSWORD }}
        run: ./scripts/signing-key.sh

      - name: Save signing key to cache
        if: steps.keycache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .signing
          key: loli-signing-key-v1

      - name: Tests + build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LOLI_VERSION_NAME: ${{ steps.v.outputs.version }}
        run: |
          TASK=$([ "${{ steps.v.outputs.type }}" = "debug" ] && echo assembleDebug || echo assembleRelease)
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:$TASK
          mkdir -p dist
          cp app/build/outputs/apk/${{ steps.v.outputs.type }}/*.apk "dist/loli-${{ steps.v.outputs.version }}-${{ steps.v.outputs.type }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Лоли ${{ steps.v.outputs.version }}
          files: dist/*.apk
          prerelease: ${{ steps.v.outputs.type == 'debug' }}
          generate_release_notes: true
