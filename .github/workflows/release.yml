name: Release APK

# Публикует подписанный APK в GitHub Releases (релизы не расходуют квоту Actions artifacts).
# Запуск: вкладка Actions → Release APK → Run workflow, либо push тега вида v1.0.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия (например 1.0.0)"
        required: true
        default: "1.0.0"
      build_type:
        description: "Тип сборки"
        type: choice
        options: [release, debug]
        default: release
      new_key:
        description: "Создать НОВЫЙ ключ подписи, если прежнего нет (обновления поверх установленной Лоли перестанут ставиться!)"
        type: boolean
        default: false
      beta:
        description: "Бета-версия (увидят только те, кто включил бета-обновления; версия вида 2.0.0-beta.1)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # Релиз подписывается постоянным ключом, который доступен только тут; из чужой ветки его не читаем.
      - name: Release only from main or a version tag
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) ;;
            *) echo "::error::Релиз собирается только из main или тега vX.Y.Z (сейчас: $GITHUB_REF)"; exit 1 ;;
          esac

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then VERSION="${GITHUB_REF_NAME#v}"; TYPE=release; else VERSION="${{ inputs.version }}"; TYPE="${{ inputs.build_type }}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Cache Vosk model
        uses: actions/cache@v4
        with:
          path: |
            app/vosk-assets
            app/vosk-cache
          key: vosk-model-small-ru-0.22

      - name: Offline speech model (embedded into APK)
        run: ./scripts/fetch-vosk-model.sh

      # Постоянный ключ подписи: из секрета LOLI_KEYSTORE_BASE64, а если его нет — созданный один раз
      # и хранящийся в кэше Actions. Одинаковая подпись нужна, чтобы новые версии ставились поверх старых.
      - name: Restore signing key from cache
        id: keycache
        uses: actions/cache/restore@v4
        with:
          path: .signing
          key: loli-signing-key-v1

      - name: Prepare signing key
        env:
          LOLI_KEYSTORE_BASE64: ${{ secrets.LOLI_KEYSTORE_BASE64 }}
          LOLI_KEYSTORE_PASSWORD_SECRET: ${{ secrets.LOLI_KEYSTORE_PASSWORD }}
          LOLI_KEY_ALIAS_SECRET: ${{ secrets.LOLI_KEY_ALIAS }}
          LOLI_KEY_PASSWORD_SECRET: ${{ secrets.LOLI_KEY_PASSWORD }}
          LOLI_ALLOW_NEW_KEY: ${{ inputs.new_key == true && '1' || '' }}
        run: ./scripts/signing-key.sh

      - name: Save signing key to cache
        if: steps.keycache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .signing
          key: loli-signing-key-v1

      - name: Tests + build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LOLI_VERSION_NAME: ${{ steps.v.outputs.version }}
        run: |
          TASK=$([ "${{ steps.v.outputs.type }}" = "debug" ] && echo assembleDebug || echo assembleRelease)
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:$TASK
          mkdir -p dist
          cp app/build/outputs/apk/${{ steps.v.outputs.type }}/*.apk "dist/loli-${{ steps.v.outputs.version }}-${{ steps.v.outputs.type }}.apk"

      - name: Check native libraries in APK
        run: |
          apk=$(ls dist/*.apk | head -1)
          unzip -l "$apk" | grep -E "lib/arm64-v8a/.*\.so" | awk '{print $1, $4}'
          for lib in libloli_llm.so libsherpa-onnx-jni.so; do
            unzip -l "$apk" | grep -q "lib/arm64-v8a/$lib" || { echo "::error::$lib не попала в APK"; exit 1; }
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Лоли ${{ steps.v.outputs.version }}
          files: dist/*.apk
          prerelease: ${{ steps.v.outputs.type == 'debug' || inputs.beta == true || contains(steps.v.outputs.version, '-') }}
          make_latest: ${{ (steps.v.outputs.type == 'debug' || inputs.beta == true || contains(steps.v.outputs.version, '-')) && 'false' || 'true' }}
          generate_release_notes: true

  windows:
    name: Windows installer
    needs: release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Модель русской речи вшивается в установщик: микрофон работает сразу, без скачивания.
      - name: Speech model for Windows
        run: |
          $zip = "$env:RUNNER_TEMP\vosk.zip"
          Invoke-WebRequest "https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\vosk" -Force
          New-Item -ItemType Directory -Force desktop/resources/common | Out-Null
          Move-Item "$env:RUNNER_TEMP\vosk\vosk-model-small-ru-0.22" desktop/resources/common/vosk-model-ru
      - name: WiX 3
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) { choco install wixtoolset --no-progress -y }
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\WiX Toolset v3.14\bin"
      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="${{ inputs.version }}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build installer
        shell: bash
        run: |
          ./gradlew --no-daemon "-Ploli.skipAndroid=true" "-Ploli.desktopVersion=${{ steps.v.outputs.version }}" :desktop:packageMsi
          mkdir -p dist
          cp desktop/build/compose/binaries/main/msi/*.msi "dist/loli-${{ steps.v.outputs.version }}-windows.msi"
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          files: dist/*.msi
