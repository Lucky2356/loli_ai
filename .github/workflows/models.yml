name: Models

# Служебный релиз models-v1: офлайн-модель для разговора (Qwen 2.5 1.5B Instruct, Apache-2.0, GGUF Q4_K_M).
# Приложение скачивает её отсюда по кнопке и проверяет по sha256. Пререлиз не считается «последней версией».
on:
  push:
    paths: [".github/workflows/models.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download model
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fSL --retry 3 -o out/loli-llm-qwen2.5-1.5b-q4_k_m.gguf \
            "https://huggingface.co/bartowski/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf"
          curl -fsSL -o out/LICENSE-Qwen2.5.txt "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct/raw/main/LICENSE" || echo "Apache-2.0" > out/LICENSE-Qwen2.5.txt
          cd out && sha256sum * | tee SHA256SUMS && ls -la

      - name: Publish models-v1 (prerelease)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models-v1
          name: Модели Лоли (служебный)
          body: Офлайн-модель для разговора (Qwen 2.5 1.5B Instruct, Apache-2.0). Служебный релиз — приложение скачивает файл отсюда.
          prerelease: true
          make_latest: false
          files: out/*
