name: Keep signing key

# Кэш Actions с ключом подписи стирается через 7 дней без обращений. Раз в неделю обращаемся к нему,
# а если его нет — громко падаем: лучше узнать об этом сейчас, чем при релизе с другой подписью.
# Ключ не читается ничем, кроме этой проверки и release.yml.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore signing key cache
        id: keycache
        uses: actions/cache/restore@v4
        with:
          path: .signing
          key: loli-signing-key-v1
      - name: Fail loudly if the key is gone
        if: steps.keycache.outputs.cache-hit != 'true'
        env:
          HAS_SECRET: ${{ secrets.LOLI_KEYSTORE_BASE64 != '' && '1' || '' }}
        run: |
          if [ -n "$HAS_SECRET" ]; then echo "Ключ берётся из секретов репозитория — кэш не нужен."; exit 0; fi
          echo "::error::Ключа подписи в кэше нет и секретов нет: следующий релиз получит другую подпись. См. docs/SIGNING.md"
          exit 1
