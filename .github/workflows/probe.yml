name: Probe

# Служебная проверка голосов-кандидатов: синтез фразы, высота тона (женский/мужской) и разборчивость
# (распознаём синтезированную речь Vosk и считаем ошибки). Ничего не публикует, образцы — в артефактах.
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tools
        run: pip install -q sherpa-onnx onnx numpy soundfile vosk librosa
      - name: Reference voice (Irina) and ASR model
        run: |
          set -euo pipefail
          gh release download tts-models --repo k2-fsa/sherpa-onnx --pattern "vits-piper-ru_RU-irina-medium.tar.bz2" --dir ref
          tar -xjf ref/vits-piper-ru_RU-irina-medium.tar.bz2 -C ref
          ls ref/vits-piper-ru_RU-irina-medium
          curl -sSL -o vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          echo "vosk zip sha256: $(sha256sum vosk.zip)"
          unzip -q vosk.zip
      - name: Evaluate
        run: |
          cat > eval.py <<'PY'
          import json, os, sys, subprocess, urllib.request, shutil, wave
          import numpy as np, onnx, soundfile as sf, librosa, sherpa_onnx
          from vosk import Model, KaldiRecognizer
          REF = "ref/vits-piper-ru_RU-irina-medium"
          TEXT = "Привет! Сегодня в Москве плюс двенадцать градусов, днём небольшой дождь. Напомню позвонить маме в семь вечера."
          names = sys.argv[1:]
          asr = Model("vosk-model-small-ru-0.22")
          ref_json = json.load(open(f"{REF}/ru_RU-irina-medium.onnx.json"))
          rows = []
          os.makedirs("samples", exist_ok=True)
          def words(t):
              import re
              return re.findall(r"[а-яё]+", t.lower().replace("ё", "е"))
          def wer(ref, hyp):
              r, h = words(ref), words(hyp)
              d = list(range(len(h) + 1))
              for i in range(1, len(r) + 1):
                  prev, d[0] = d[0], i
                  for j in range(1, len(h) + 1):
                      cur = min(d[j] + 1, d[j - 1] + 1, prev + (r[i - 1] != h[j - 1]))
                      prev, d[j] = d[j], cur
              return d[len(h)] / len(r)
          for name in names:
              d = f"cand/{name}"
              os.makedirs(d, exist_ok=True)
              if name == "irina":
                  model = f"{REF}/ru_RU-irina-medium.onnx"; tokens = f"{REF}/tokens.txt"
              else:
                  base = f"https://huggingface.co/rraaww/ru_piper/resolve/main/ru_RU-{name}"
                  urllib.request.urlretrieve(base + ".onnx", f"{d}/model.onnx")
                  urllib.request.urlretrieve(base + ".onnx.json", f"{d}/model.onnx.json")
                  cfg = json.load(open(f"{d}/model.onnx.json"))
                  same = cfg.get("phoneme_id_map") == ref_json.get("phoneme_id_map")
                  m = onnx.load(f"{d}/model.onnx")
                  meta = {"model_type": "vits", "comment": "piper", "language": "Russian", "voice": "ru", "has_espeak": "1",
                          "n_speakers": "1", "sample_rate": str(cfg["audio"]["sample_rate"])}
                  del m.metadata_props[:]
                  for k, v in meta.items():
                      p = m.metadata_props.add(); p.key = k; p.value = v
                  onnx.save(m, f"{d}/model.onnx")
                  model = f"{d}/model.onnx"; tokens = f"{REF}/tokens.txt"
                  print(name, "phoneme map same as Irina:", same, "inference:", cfg.get("inference"))
              try:
                  tts = sherpa_onnx.OfflineTts(sherpa_onnx.OfflineTtsConfig(model=sherpa_onnx.OfflineTtsModelConfig(
                      vits=sherpa_onnx.OfflineTtsVitsModelConfig(model=model, tokens=tokens, data_dir=f"{REF}/espeak-ng-data"), num_threads=2)))
                  a = tts.generate(TEXT, sid=0, speed=1.0)
                  samples = np.array(a.samples, dtype=np.float32)
                  sf.write(f"samples/{name}.wav", samples, a.sample_rate)
                  f0, vf, _ = librosa.pyin(samples, fmin=60, fmax=400, sr=a.sample_rate)
                  pitch = float(np.nanmedian(f0))
                  y16 = librosa.resample(samples, orig_sr=a.sample_rate, target_sr=16000)
                  pcm = (np.clip(y16, -1, 1) * 32767).astype(np.int16).tobytes()
                  rec = KaldiRecognizer(asr, 16000)
                  rec.AcceptWaveform(pcm)
                  hyp = json.loads(rec.FinalResult())["text"]
                  e = wer(TEXT, hyp)
                  size = os.path.getsize(model)
                  rows.append((name, round(pitch), round(e, 3), size, hyp))
                  print(f"RESULT {name}: pitch={pitch:.0f}Hz wer={e:.3f} dur={len(samples)/a.sample_rate:.1f}s size={size} :: {hyp}")
              except Exception as ex:
                  print(f"RESULT {name}: FAILED {ex}")
              sys.stdout.flush()
          print("\nSUMMARY (pitch Hz, WER):")
          for r in sorted(rows, key=lambda r: r[2]):
              print("SUM", r[0], r[1], r[2], r[3])
          PY
          python eval.py irina april420-medium dict-medium_epoch3874 fr6800-medium igm3500-medium igm3602-medium igm3804-medium kat580-medium mari-medium_epoch5699 nara426-medium pvo240-medium sova200-medium sushkov_v4-medium terra-medium_epoch5319 terra-medium_epoch5839 terra5862-medium terra5871-medium
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: samples/
