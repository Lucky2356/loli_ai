name: Probe

# Временная проверка: версия и API llama.cpp, доступность модели Qwen 2.5 1.5B (GGUF).
on:
  push:
    paths: [".github/workflows/probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: llama.cpp
        run: |
          set -x +e
          TAG=$(gh release view --repo ggml-org/llama.cpp --json tagName -q .tagName)
          echo "TAG=$TAG"
          curl -sSL -o llama.tgz "https://github.com/ggml-org/llama.cpp/archive/refs/tags/$TAG.tar.gz"
          sha256sum llama.tgz; ls -la llama.tgz
          mkdir src && tar -xzf llama.tgz -C src --strip-components=1
          ls src; ls src/examples | head -50; ls src/examples/llama.android 2>/dev/null; find src -path '*llama.android*' -name '*.cpp' | head
          for fn in llama_model_load_from_file llama_init_from_model llama_model_default_params llama_context_default_params llama_tokenize llama_token_to_piece llama_decode llama_batch_get_one llama_sampler_chain_init llama_sampler_chain_add llama_sampler_init_greedy llama_sampler_init_temp llama_sampler_init_top_p llama_sampler_init_min_p llama_sampler_init_dist llama_sampler_init_penalties llama_sampler_sample llama_vocab_is_eog llama_model_get_vocab llama_chat_apply_template llama_model_chat_template llama_backend_init llama_model_free llama_free llama_memory_clear llama_get_memory llama_n_ctx llama_log_set llama_sampler_free llama_batch_init; do
            grep -n -A4 "$fn(" src/include/llama.h | head -8 || true
          done
          grep -n "struct llama_context_params {" -A45 src/include/llama.h || true
          grep -n "struct llama_model_params {" -A30 src/include/llama.h || true
          grep -n "typedef struct llama_chat_message" -A5 src/include/llama.h || true
          find src/examples/llama.android -type f | head -60
          for f in $(find src/examples/llama.android -name '*.cpp' -o -name 'CMakeLists.txt' -o -name 'build.gradle.kts' | grep -v '/app/'); do echo "===== $f"; cat "$f"; done
          cat src/ggml/CMakeLists.txt | grep -n "option(GGML_" | head -80 || true
      - name: Models
        run: |
          for u in \
            "https://huggingface.co/bartowski/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf" \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf" \
            "https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/main/Qwen2.5-3B-Instruct-Q4_K_M.gguf" \
            "https://huggingface.co/bartowski/google_gemma-3-1b-it-GGUF/resolve/main/google_gemma-3-1b-it-Q4_K_M.gguf" \
            "https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf" ; do
            echo "== $u"; curl -sIL "$u" | grep -iE "^HTTP|content-length|x-linked-size|x-linked-etag" | tail -4
          done
