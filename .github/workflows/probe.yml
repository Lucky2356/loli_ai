name: Probe

# Временная проверка бесплатных источников данных (погода, курсы, новости, Википедия, радио).
on:
  push:
    paths: [".github/workflows/probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch samples
        run: |
          mkdir -p s
          get() { echo "=== $1 $2"; code=$(curl -sSL -A "LoliAssistant" -o "s/$1" -w "%{http_code} %{content_type} %{size_download}" --max-time 25 "$2" || echo fail); echo "$code"; head -c 1500 "s/$1" | tr '\n' ' ' ; echo; }
          get geo.json "https://geocoding-api.open-meteo.com/v1/search?name=%D0%9C%D0%BE%D1%81%D0%BA%D0%B2%D0%B0&count=1&language=ru&format=json"
          get forecast.json "https://api.open-meteo.com/v1/forecast?latitude=55.75&longitude=37.62&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=auto&forecast_days=7&wind_speed_unit=ms"
          get cbr.json "https://www.cbr-xml-daily.ru/daily_json.js"
          get coingecko.json "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=rub,usd"
          for f in "ria https://ria.ru/export/rss2/archive/index.xml" "ria_sport https://rsport.ria.ru/export/rss2/archive/index.xml" "ria_science https://ria.ru/export/rss2/science/index.xml" "ria_economy https://ria.ru/export/rss2/economy/index.xml" "lenta https://lenta.ru/rss/news" "lenta_sport https://lenta.ru/rss/news/sport" "lenta_science https://lenta.ru/rss/news/science" "lenta_economics https://lenta.ru/rss/news/economics" "tass https://tass.ru/rss/v2.xml" "rbc https://rssexport.rbc.ru/rbcnews/news/30/full.rss" "habr https://habr.com/ru/rss/news/?fl=ru"; do set -- $f; get "$1.xml" "$2"; done
          get wiki_search.json "https://ru.wikipedia.org/w/api.php?action=query&list=search&srsearch=%D0%93%D0%B0%D0%B3%D0%B0%D1%80%D0%B8%D0%BD&srlimit=3&format=json&utf8=1"
          get wiki_summary.json "https://ru.wikipedia.org/api/rest_v1/page/summary/%D0%93%D0%B0%D0%B3%D0%B0%D1%80%D0%B8%D0%BD,_%D0%AE%D1%80%D0%B8%D0%B9_%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B5%D0%B5%D0%B2%D0%B8%D1%87"
          get wiki_extract.json "https://ru.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&exsentences=3&redirects=1&titles=%D0%93%D0%B0%D0%B3%D0%B0%D1%80%D0%B8%D0%BD&format=json&utf8=1"
          get radio.json "https://all.api.radio-browser.info/json/stations/search?name=%D0%95%D0%B2%D1%80%D0%BE%D0%BF%D0%B0%20%D0%BF%D0%BB%D1%8E%D1%81&limit=3&hidebroken=true&order=clickcount&reverse=true"
          get radio_servers.json "https://all.api.radio-browser.info/json/servers"
          get radio_ru.json "https://de1.api.radio-browser.info/json/stations/search?countrycode=RU&limit=40&hidebroken=true&order=clickcount&reverse=true"
          python3 - <<'PY'
          import json
          try:
              for s in json.load(open('s/radio_ru.json')):
                  print(s['name'][:40], '|', s['url_resolved'][:100], '|', s['codec'], s['bitrate'], s['tags'][:40])
          except Exception as e: print(e)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: samples
          path: s/
