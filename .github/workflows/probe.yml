name: Probe

# Служебная разведка: доступность адресов навыков и список русских офлайн-голосов. Ничего не публикует.
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skill endpoints
        run: |
          set +e
          UA="LoliAssistant/2.0 (Android; +https://github.com/Lucky2356/loli_ai)"
          for u in \
            "https://geocoding-api.open-meteo.com/v1/search?name=%D0%9C%D0%BE%D1%81%D0%BA%D0%B2%D0%B0&count=10&language=ru&format=json" \
            "https://api.open-meteo.com/v1/forecast?latitude=55.7520&longitude=37.6178&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=auto&forecast_days=7&wind_speed_unit=ms" \
            "https://lenta.ru/rss/news" "https://tass.ru/rss/v2.xml" "https://ria.ru/export/rss2/archive/index.xml" \
            "https://lenta.ru/rss/news/sport" "https://lenta.ru/rss/news/science" "https://habr.com/ru/rss/news/?fl=ru" \
            "https://lenta.ru/rss/news/economics" "https://rssexport.rbc.ru/rbcnews/news/30/full.rss" \
            "https://www.cbr-xml-daily.ru/daily_json.js" \
            "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether&vs_currencies=rub" \
            "https://ru.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&exsentences=4&redirects=1&titles=%D0%93%D0%B0%D0%B3%D0%B0%D1%80%D0%B8%D0%BD&format=json&utf8=1" \
            "https://all.api.radio-browser.info/json/stations/search?name=europa&limit=3&hidebroken=true" ; do
            echo "=== $u"
            curl -sS -A "$UA" -L -o body -w "%{http_code} %{content_type} %{size_download}\n" --max-time 30 "$u"
            head -c 300 body; echo
          done

      - name: sherpa-onnx TTS models (ru)
        run: |
          set +e
          gh release view tts-models --repo k2-fsa/sherpa-onnx --json assets -q '.assets[].name' > assets.txt
          wc -l assets.txt
          grep -iE 'ru|rus|russian|multi' assets.txt
          echo "--- all vits/matcha/kokoro names"
          grep -iE 'vits|matcha|kokoro|kitten|supertonic' assets.txt | head -300

      - name: HuggingFace Russian TTS (onnx)
        run: |
          set +e
          for q in "piper ru_RU" "ru_RU piper" "russian tts onnx" "vits russian" "piper-voices russian" "sherpa-onnx ru" "rhvoice"; do
            echo "=== $q"
            curl -sS "https://huggingface.co/api/models?search=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")&limit=40" | python3 -c "import sys,json;[print(m['id'], m.get('downloads'), m.get('tags',[])[:6]) for m in json.load(sys.stdin)]"
          done
          echo "=== rhasspy piper-voices ru"
          curl -sS "https://huggingface.co/api/models/rhasspy/piper-voices/tree/main/ru/ru_RU" | python3 -c "import sys,json;[print(x['path']) for x in json.load(sys.stdin)]"
          curl -sS https://huggingface.co/rhasspy/piper-voices/raw/main/voices.json | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for k,v in d.items():
              if k.startswith('ru'): print(k, v.get('quality'), v.get('num_speakers'), v.get('speaker_id_map'))
          "

      - name: RHVoice
        run: |
          set +e
          gh release list --repo RHVoice/RHVoice --limit 5
          gh api repos/RHVoice/RHVoice/contents/data/voices --jq '.[].name'
          for v in anna elena irina tatiana victoria natalia natasha; do
            echo "=== $v"; gh api "repos/RHVoice/RHVoice/contents/data/voices/$v" --jq '.[].name' 2>&1 | head
            gh api "repos/RHVoice/RHVoice/contents/data/voices/$v/voice.info" --jq '.content' 2>/dev/null | base64 -d | head -20
          done
          gh api repos/RHVoice/RHVoice/contents/data/voices/.gitmodules --jq .content 2>/dev/null | base64 -d | head
          gh api repos/RHVoice/RHVoice/contents/.gitmodules --jq .content 2>/dev/null | base64 -d | head -80
