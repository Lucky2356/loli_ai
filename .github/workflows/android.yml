name: Android CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core tests (domain, AI, sync)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests of shared core
        run: ./gradlew --no-daemon -Ploli.skipAndroid=true :core:test
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          retention-days: 7

  desktop:
    name: Windows client (MSI)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Модель русской речи вшивается в установщик: микрофон работает сразу, без скачивания.
      - name: Speech model for Windows
        run: |
          $zip = "$env:RUNNER_TEMP\vosk.zip"
          Invoke-WebRequest "https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\vosk" -Force
          New-Item -ItemType Directory -Force desktop/resources/common | Out-Null
          Move-Item "$env:RUNNER_TEMP\vosk\vosk-model-small-ru-0.22" desktop/resources/common/vosk-model-ru
      # jpackage собирает MSI через WiX 3: он уже есть на образе, ставим только если вдруг нет.
      - name: WiX 3
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) { choco install wixtoolset --no-progress -y }
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\WiX Toolset v3.14\bin"
      # Проверки на настоящей Windows: синтезатор речи, шифрование ключей DPAPI, один экземпляр, напоминания.
      - name: Windows client tests
        run: ./gradlew --no-daemon "-Ploli.skipAndroid=true" :desktop:test
      - name: Build Windows installer
        run: ./gradlew --no-daemon "-Ploli.skipAndroid=true" :desktop:packageMsi
      - name: Installer logs
        if: failure()
        shell: bash
        run: cat desktop/build/compose/logs/packageMsi/*.txt || true
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: loli-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          retention-days: 14

  supabase:
    name: Supabase schema + RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loli_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Migrations + RLS tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loli_test
        run: ./scripts/test-supabase.sh

  android:
    name: Lint + unit tests + debug APK
    needs: [core, supabase]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Vosk model
        uses: actions/cache@v4
        with:
          path: |
            app/vosk-assets
            app/vosk-cache
          key: vosk-model-small-ru-0.22

      - name: Offline speech model (embedded into APK)
        run: ./scripts/fetch-vosk-model.sh

      # Проверки (в том числе на чужих pull request) НЕ получают релизный ключ подписи: он лежит в кэше Actions,
      # и изменённый workflow мог бы его прочитать. Здесь сборки подписываются временным debug-ключом;
      # постоянный ключ используется только в release.yml (запуск вручную и по тегу).
      - name: Lint, unit tests, assemble
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/loli-debug-${GITHUB_SHA::7}.apk"
          ls -la dist
          echo "### APK собран: loli-debug-${GITHUB_SHA::7}.apk ($(du -h dist/*.apk | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        id: upload
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: loli-debug-apk
          path: dist/*.apk
          retention-days: 14
          compression-level: 0

      - name: Artifact quota warning
        if: steps.upload.outcome == 'failure'
        run: |
          echo "::warning::Не удалось сохранить APK как artifact (вероятно, исчерпана квота хранилища Actions). Скачайте APK из GitHub Releases (workflow «Release APK») или удалите старые артефакты."
          echo "⚠️ Artifact не загружен (квота хранилища). Используйте workflow **Release APK**." >> "$GITHUB_STEP_SUMMARY"

      - name: Lint errors in log
        if: failure()
        run: |
          f=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          [ -f "$f" ] && grep -A3 ": Error:" "$f" || true

      - name: Lint report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  emulator:
    name: Live check on Android emulator
    needs: [core]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: ./gradlew --no-daemon -Ploli.emulator=true :app:assembleDebug :app:assembleDebugAndroidTest
      # Настоящая сеть и сетевой стек Android: погода, новости, курсы, Википедия, радио; разбор фраз на ICU.
      - name: Live skills on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew --no-daemon -Ploli.emulator=true :app:connectedDebugAndroidTest
      - name: Live check log
        if: always()
        run: |
          find app/build/outputs/androidTest-results -name "*.xml" -exec grep -h -o 'LIVE[^<]*' {} \; | head -60 || true
          find app/build/outputs/androidTest-results -name "*.txt" -exec grep -h "LIVE" {} \; | head -60 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-report
          path: app/build/reports/androidTests/
