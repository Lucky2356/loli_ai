name: Android CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core tests (domain, AI, sync)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests of shared core
        run: ./gradlew --no-daemon -Ploli.skipAndroid=true :core:test
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          retention-days: 7

  supabase:
    name: Supabase schema + RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loli_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Migrations + RLS tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loli_test
        run: ./scripts/test-supabase.sh

  android:
    name: Lint + unit tests + debug APK
    needs: [core, supabase]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Vosk model
        uses: actions/cache@v4
        with:
          path: |
            app/vosk-assets
            app/vosk-cache
          key: vosk-model-small-ru-0.22

      - name: Offline speech model (embedded into APK)
        run: ./scripts/fetch-vosk-model.sh

      - name: Restore signing key (optional)
        env:
          LOLI_KEYSTORE_BASE64: ${{ secrets.LOLI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LOLI_KEYSTORE_BASE64" ]; then
            echo "$LOLI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/loli.jks"
            echo "LOLI_KEYSTORE_FILE=$RUNNER_TEMP/loli.jks" >> "$GITHUB_ENV"
            echo "Подпись постоянным ключом из секретов"
          else
            echo "::notice::LOLI_KEYSTORE_BASE64 не задан — APK подписан временным debug-ключом (обновление поверх потребует переустановки)"
          fi

      - name: Lint, unit tests, assemble
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LOLI_KEYSTORE_PASSWORD: ${{ secrets.LOLI_KEYSTORE_PASSWORD }}
          LOLI_KEY_ALIAS: ${{ secrets.LOLI_KEY_ALIAS }}
          LOLI_KEY_PASSWORD: ${{ secrets.LOLI_KEY_PASSWORD }}
          LOLI_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/loli-debug-${GITHUB_SHA::7}.apk"
          ls -la dist
          echo "### APK собран: loli-debug-${GITHUB_SHA::7}.apk ($(du -h dist/*.apk | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        id: upload
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: loli-debug-apk
          path: dist/*.apk
          retention-days: 14
          compression-level: 0

      - name: Artifact quota warning
        if: steps.upload.outcome == 'failure'
        run: |
          echo "::warning::Не удалось сохранить APK как artifact (вероятно, исчерпана квота хранилища Actions). Скачайте APK из GitHub Releases (workflow «Release APK») или удалите старые артефакты."
          echo "⚠️ Artifact не загружен (квота хранилища). Используйте workflow **Release APK**." >> "$GITHUB_STEP_SUMMARY"

      - name: Lint report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
